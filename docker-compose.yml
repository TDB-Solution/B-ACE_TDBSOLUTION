services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bace
      POSTGRES_PASSWORD: bace
      POSTGRES_DB: bace
    ports:
      - "5433:5432"
    volumes:
      - bace_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bace -d bace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://bace:bace@postgres:5432/bace?schema=public
      JWT_SECRET: change-me-in-production
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  bace_pg:
